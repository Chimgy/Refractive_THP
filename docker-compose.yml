services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refractive_thp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: refractive_thp
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 5m
      REFRESH_TOKEN_TTL_DAYS: 30
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: 'false'
      AUTH_CACHE_TTL_SECONDS: 300
      CORS_ORIGIN: http://localhost:5173
      REFRESH_TOKEN_COOKIE_NAME: thp_refresh_token
      COOKIE_DOMAIN: ''
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Public tunnel to `backend` for THP_analytics.js — an embed script on a
  # third-party site can't reach `localhost`, so this exposes the local dev
  # backend at a stable public URL. Named Cloudflare Tunnel, not ngrok — the
  # ngrok free tier serves its own browser-warning interstitial in place of
  # the real response on every request, and a bare `<script src>` tag can't
  # attach the header that bypasses it, so it can never work for this case.
  # Needs CLOUDFLARE_TUNNEL_TOKEN in a root .env (see .env.example) — same
  # value works on any machine, so `docker compose up cloudflared` gets you
  # the same embed URL on a new laptop. Hostname routing (which public
  # hostname points at this tunnel) is configured in the Cloudflare Zero
  # Trust dashboard, not here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
